# builder-loop 项目层配置 schema — 业务项目在 .claude/loop.yml 里按此填写。
# runtime 只消费下列字段，其余忽略。

pass_cmd:
  # 通过条件命令数组，按顺序在候选 worktree 内执行；任一非 0 即 FAIL；至少 1 个阶段。
  # cmd 通过 `bash -c "$CMD"` 执行；必须能在一个新 checkout 里跑通（不能依赖主仓的 venv 编辑安装）。
  type: array
  required: true
  min_items: 1
  item_schema:
    stage:   { type: string,  required: true, examples: [lint, typecheck, test, build] }
    cmd:     { type: string,  required: true }
    timeout: { type: integer, default: 300, unit: seconds }

max_iterations:
  # machine 尝试次数上限；到达且未 PASS → runtime 拒绝再跑，续跑需要用户授权（bl resume）。
  type: integer
  default: 5

proof_runner:
  # proof 的测试命令前缀，start 时冻结进 contract 的 assurance 面（计入 digest，run 中途变更需用户授权）。
  # tester 只给 test id，runtime 拼命令；不过 shell（shlex 拆分），只展开 {main_repo} 一个占位符。
  framework:
    type: enum
    values: [pytest, generic]
    default: pytest
    description: |
      pytest  — runtime 追加 `-q -p no:cacheprovider --junitxml=<tmp> <test ids>`，按 junit 逐用例判定；
                test id 是 pytest node id（tests/test_x.py::test_a、tests/test_x.py::TestC::test_m）。
      generic — 只看退出码，因此只能做 mutation（不能区分断言失败与启动错误）。test id 原样追加到命令末尾，
                或替换命令里的 `{tests}` 占位符；含义由项目自己的 runner 决定（如 go 的包路径、cargo 的过滤串）。
  cmd:
    type: string
    default: "python3 -m pytest"
    examples:
      - "{main_repo}/.venv/bin/python -m pytest"
      - "uv run --no-project --with-requirements requirements.txt --with pytest python -m pytest"
      - "go test {tests} -count=1"

worktree:
  root:
    # worktree 根目录；相对路径以项目根解析。默认仓库同级 ../builder-loop-worktrees/<repo>。
    type: string
    default: ""

# 示例（最小可用配置）
# pass_cmd:
#   - { stage: lint, cmd: "ruff check src", timeout: 60 }
#   - { stage: test, cmd: "python3 -m pytest -q tests", timeout: 300 }
# max_iterations: 5
