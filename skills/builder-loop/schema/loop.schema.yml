# builder-loop V8 项目层配置 schema — 业务项目在 .claude/loop.yml 里按此填写。
# runtime 只消费下列字段，其余忽略。

pass_cmd:
  # 通过条件命令数组，按顺序在候选 worktree 内执行；任一非 0 即 FAIL；至少 1 个阶段。
  # cmd 通过 `bash -c "$CMD"` 执行；必须能在一个新 checkout 里跑通（不能依赖主仓的 venv 编辑安装）。
  type: array
  required: true
  min_items: 1
  item_schema:
    stage:   { type: string,  required: true, examples: [lint, typecheck, test, build] }
    cmd:     { type: string,  required: true }
    timeout: { type: integer, default: 300, unit: seconds }

max_iterations:
  # machine 尝试次数上限；到达且未 PASS → readiness 报 MAX_ITERATIONS 交还用户。
  type: integer
  default: 5

worktree:
  root:
    # 候选 worktree 根目录；相对路径以项目根解析。默认仓库同级 ../builder-loop-worktrees/<repo>。
    type: string
    default: ""

# 示例（最小可用配置）
# pass_cmd:
#   - { stage: lint, cmd: "ruff check src", timeout: 60 }
#   - { stage: test, cmd: "python3 -m pytest -q tests", timeout: 300 }
# max_iterations: 5
